<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0f">
<title>A-Music</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    [hidden] { display: none !important; }
    :root { --bg: #0d0d0f; --panel: #17171a; --line: #26262b; --text: #f2f2f4; --muted: #8b8b94; --accent: #ff5500; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 96px; }

    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #000; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
    header .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    header a { color: var(--text); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 6px; background: #1f1f24; }
    header .who { margin-left: auto; font-size: 12px; color: var(--muted); }

    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .tab { padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; font-size: 13px; cursor: pointer; }
    .tab.on { background: var(--text); color: #000; border-color: var(--text); font-weight: 700; }
    .btn { padding: 8px 14px; border: none; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost { background: #1f1f24; color: var(--text); }
    .btn.danger { background: #3a1a1a; color: #ff7a7a; }
    .btn.ok { background: #14331f; color: #7ee0a0; }
    .btn.small { padding: 6px 10px; font-size: 12px; }
    .btn.on { background: var(--text); color: #000; }

    h2 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 12px; }
    section { margin-bottom: 26px; }
    .guest { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { flex: 0 0 150px; scroll-snap-align: start; cursor: pointer; }
    .grid .card { flex: none; }
    .cov { width: 150px; height: 150px; border-radius: 8px; overflow: hidden; position: relative; background: #1f1f24; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; color: rgba(255,255,255,.85); }
    .grid .cov, .grid .card { width: 100%; }
    .grid .cov { height: auto; aspect-ratio: 1; }
    .cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cplay { position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .ctt { margin-top: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .list { display: flex; flex-direction: column; }
    .track { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; }
    .track:hover { background: var(--panel); }
    .track.playing .tt { color: var(--accent); }
    .thumb { width: 52px; height: 52px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #1f1f24; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: rgba(255,255,255,.85); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .play:disabled { background: #2a2a2e; cursor: default; }
    .meta { flex: 1; min-width: 0; }
    .tt { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ta { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1f1f24; color: var(--muted); }
    .tag.pending { background: #33290f; color: #f0c25a; }
    .tag.rejected { background: #3a1a1a; color: #ff7a7a; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
    .back { font-size: 13px; color: var(--muted); cursor: pointer; margin-bottom: 10px; display: inline-block; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
    .panel h3 { font-size: 15px; margin-bottom: 10px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    input[type=text], select, textarea { background: #0d0d0f; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 14px; outline: none; font-family: inherit; }
    textarea { min-height: 70px; resize: vertical; }
    input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input[type=file] { color: var(--muted); font-size: 13px; }
    .check { flex-direction: row; gap: 8px; align-items: flex-start; font-size: 12px; }
    .msg { font-size: 13px; min-height: 16px; color: #ff7a7a; }
    .msg.ok { color: #7ee0a0; }

    /* Вікно треку */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 24px 12px; overflow-y: auto; }
    .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(620px, 100%); padding: 20px; position: relative; }
    .mclose { position: absolute; right: 12px; top: 8px; background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; }
    .mtop { display: flex; gap: 18px; align-items: flex-start; }
    .mcov { width: 160px; height: 160px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #1f1f24; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700; color: rgba(255,255,255,.85); }
    .mcov img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .minfo { flex: 1; min-width: 0; }
    .minfo h3 { font-size: 20px; margin-bottom: 4px; word-break: break-word; }
    .mart { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .mdesc { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin: 12px 0; color: #d6d6dc; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin-top: 8px; }
    dt { color: var(--muted); }
    dd { color: var(--text); }
    .mbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .mlink { font-size: 12px; color: var(--muted); margin-top: 10px; word-break: break-all; }
    .mcom { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
    .cm { padding: 8px 0; border-bottom: 1px solid #1f1f24; font-size: 13px; }
    .cm b { font-size: 13px; }
    .cm .dt { color: var(--muted); font-size: 11px; margin-left: 6px; }
    .cm .cb { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
    .cm button { background: none; border: none; color: #ff7a7a; font-size: 11px; cursor: pointer; margin-top: 3px; }
    .cform { display: flex; gap: 8px; margin-top: 10px; }
    .cform textarea { flex: 1; min-height: 40px; }

    /* Нижній програвач */
    .player { position: fixed; left: 0; right: 0; bottom: 0; background: #000; border-top: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 14px; z-index: 20; }
    .player.off { display: none; }
    .pcov { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #1f1f24; display: flex; align-items: center; justify-content: center; font-weight: 700; color: rgba(255,255,255,.85); }
    .pcov img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pbtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--text); color: #000; font-size: 15px; cursor: pointer; flex-shrink: 0; }
    .pinfo { min-width: 0; width: 180px; }
    .pinfo .tt { font-size: 14px; }
    .pmid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .time { font-size: 11px; color: var(--muted); width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
    input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }

    @media (max-width: 640px) {
        .card { flex-basis: 130px; }
        .cov { width: 130px; height: 130px; }
        .pinfo { width: 96px; }
        .time { display: none; }
        .acts { display: none; }
        .pcov { display: none; }
        .mtop { flex-direction: column; }
        .mcov { width: 100%; height: auto; aspect-ratio: 1; }
    }
</style>
</head>
<body>
<header>
    <div class="logo">♪ A-Music</div>
    <a href="index.html">← Головна</a>
    <div class="who" id="who"></div>
</header>

<main class="wrap">
    <div class="bar">
        <button class="tab on" data-tab="all" type="button">Усі треки</button>
        <button class="tab" data-tab="albums" type="button">Альбоми</button>
        <button class="tab" data-tab="follows" type="button" id="tabFollows" hidden>Підписки</button>
        <button class="tab" data-tab="mine" type="button" id="tabMine" hidden>Мої</button>
        <button class="tab" data-tab="review" type="button" id="tabReview" hidden>На перевірці</button>
        <button class="btn" id="toggleUpload" type="button" hidden>+ Завантажити</button>
    </div>

    <div class="guest" id="guestHint">Слухати можна без входу. Щоб ставити лайки, підписуватись на виконавців і писати коментарі, увійдіть в акаунт на головній сторінці.</div>

    <section class="panel" id="uploadCard" hidden>
        <h3>Завантажити трек</h3>
        <form id="uploadForm" novalidate>
            <label>MP3-файл, до 5 MB
                <input type="file" id="file" accept="audio/mpeg,audio/mp3,.mp3">
            </label>
            <label>Обкладинка (необов'язково, JPG або PNG)
                <input type="file" id="cover" accept="image/jpeg,image/png,image/webp">
            </label>
            <label>Назва треку
                <input type="text" id="title" maxlength="120">
            </label>
            <label>Виконавець
                <input type="text" id="artist" maxlength="120">
            </label>
            <label>Альбом (необов'язково)
                <input type="text" id="album" maxlength="120">
            </label>
            <label>Опис пісні (необов'язково, до 1000 символів)
                <textarea id="description" maxlength="1000"></textarea>
            </label>
            <label>Ліцензія
                <select id="license">
                    <option value="own">Це моя музика, я маю всі права</option>
                    <option value="cc-by">Creative Commons (CC BY), з вказанням автора</option>
                    <option value="public-domain">Суспільне надбання</option>
                </select>
            </label>
            <label class="check">
                <input type="checkbox" id="rights">
                <span>Я маю право на цей файл і погоджуюсь, що його зніматимуть за запитом правовласника.</span>
            </label>
            <div class="msg" id="uploadMsg"></div>
            <button class="btn" id="btnUpload" type="submit">Надіслати на перевірку</button>
        </form>
    </section>

    <section id="recentSec" hidden>
        <h2>Нові треки</h2>
        <div class="row" id="row"></div>
    </section>

    <section>
        <h2 id="listTitle">Усі треки</h2>
        <div id="content"></div>
    </section>
</main>

<div class="modal-bg" id="modalBg" hidden>
    <div class="modal" role="dialog" aria-modal="true">
        <button class="mclose" id="mClose" type="button" aria-label="Закрити">×</button>
        <div class="mtop">
            <div class="mcov" id="mCov"></div>
            <div class="minfo">
                <h3 id="mTitle"></h3>
                <div class="mart" id="mArtist"></div>
                <dl>
                    <dt>Альбом</dt><dd id="mAlbum"></dd>
                    <dt>Статус</dt><dd id="mStatus"></dd>
                    <dt>Ліцензія</dt><dd id="mLicense"></dd>
                    <dt>Розмір</dt><dd id="mSize"></dd>
                    <dt>Додано</dt><dd id="mDate"></dd>
                </dl>
            </div>
        </div>
        <div class="mdesc" id="mDesc"></div>
        <div class="mbtns" id="mBtns"></div>
        <div class="mlink" id="mLink"></div>
        <div class="mcom">
            <h3 style="font-size:15px; margin-bottom:8px;">Коментарі (<span id="mComCount">0</span>)</h3>
            <div id="mComList"></div>
            <div id="mComForm"></div>
        </div>
    </div>
</div>

<div class="player off" id="player">
    <div class="pcov" id="pCov"></div>
    <button class="pbtn" id="pPlay" type="button" aria-label="Відтворити">▶</button>
    <div class="pinfo">
        <div class="tt" id="pTitle"></div>
        <div style="font-size:12px; color:var(--muted);" id="pArtist"></div>
    </div>
    <div class="pmid">
        <span class="time" id="pCur">0:00</span>
        <input type="range" id="pSeek" min="0" max="0" value="0" step="0.1">
        <span class="time" id="pDur">0:00</span>
    </div>
</div>
<audio id="audio" preload="none"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/access.js"></script>
<script>
(function () {
    'use strict';
    const CFG = window.ACORE_CONFIG || {};
    const MAX_MB = CFG.MUSIC_MAX_MB || 5;
    const QUOTA_MB = CFG.MUSIC_QUOTA_MB || 20;
    const LICENSE_TEXT = { 'own': 'Власна музика', 'cc-by': 'CC BY', 'public-domain': 'Public domain' };
    const STATUS_TEXT = { 'pending': 'на перевірці', 'approved': 'схвалено', 'rejected': 'відхилено' };
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    const audio = $('audio');

    let user = null, isAdmin = false, tab = 'all', openAlbum = null;
    let approved = [];          // всі схвалені треки
    let shown = [];             // треки, які зараз у списку (для черги програвача)
    let queue = [], cur = -1;
    let liked = new Set(), follows = new Set();
    let modalTrack = null;

    const worker = () => (CFG.MUSIC_WORKER_URL || '').replace(/\/+$/, '');
    const fileUrl = path => worker() + '/music/file?key=' + encodeURIComponent(path);
    const coverUrl = path => sb.storage.from(CFG.SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl;
    const fmt = sec => {
        if (!isFinite(sec)) return '0:00';
        const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
    };
    const uploadMsg = (text, ok) => { $('uploadMsg').textContent = text; $('uploadMsg').className = 'msg' + (ok ? ' ok' : ''); };
    const who = () => (user && user.email ? user.email.split('@')[0] : 'гість');

    // Обкладинка або кольорова заглушка з першою буквою назви
    function art(t, cls) {
        const d = document.createElement('div');
        d.className = cls;
        if (t.cover_path) {
            const i = document.createElement('img');
            i.src = coverUrl(t.cover_path);
            i.alt = '';
            i.loading = 'lazy';
            d.appendChild(i);
        } else {
            const h = [...(t.title || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
            d.style.background = 'linear-gradient(135deg, hsl(' + h + ' 70% 45%), hsl(' + ((h + 60) % 360) + ' 70% 22%))';
            d.textContent = (t.title || '?').trim().charAt(0).toUpperCase();
        }
        return d;
    }

    /* ---------- Програвач ---------- */
    function setPlayingUI() {
        document.querySelectorAll('[data-id]').forEach(el => {
            const i = queue.findIndex(t => t.id === el.dataset.id);
            const on = i >= 0 && i === cur;
            el.classList.toggle('playing', on);
            const b = el.querySelector('.play');
            if (b) b.textContent = on && !audio.paused ? '❚❚' : '▶';
        });
        $('pPlay').textContent = audio.paused ? '▶' : '❚❚';
    }

    function playAt(i) {
        if (i < 0 || i >= queue.length) return;
        cur = i;
        const t = queue[i];
        audio.src = fileUrl(t.file_path);
        audio.play().catch(() => {});
        $('player').classList.remove('off');
        $('pTitle').textContent = t.title;
        $('pArtist').textContent = t.artist;
        const pc = $('pCov');
        pc.textContent = '';
        pc.appendChild(art(t, 'pcov-in'));
        $('pCur').textContent = '0:00';
        $('pSeek').value = 0;
        setPlayingUI();
    }

    function playTrack(t) {
        const list = shown.filter(x => x.status === 'approved');
        queue = list;
        const i = list.findIndex(x => x.id === t.id);
        if (i >= 0) playAt(i);
    }

    $('pPlay').addEventListener('click', () => {
        if (cur < 0) { if (queue.length) playAt(0); return; }
        audio.paused ? audio.play() : audio.pause();
    });
    audio.addEventListener('play', setPlayingUI);
    audio.addEventListener('pause', setPlayingUI);
    audio.addEventListener('ended', () => playAt(cur + 1 < queue.length ? cur + 1 : 0));
    audio.addEventListener('loadedmetadata', () => {
        $('pSeek').max = audio.duration || 0;
        $('pDur').textContent = fmt(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
        $('pSeek').value = audio.currentTime;
        $('pCur').textContent = fmt(audio.currentTime);
    });
    $('pSeek').addEventListener('input', e => { audio.currentTime = Number(e.target.value); });

    /* ---------- Картки, рядки, альбоми ---------- */
    function card(t) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.id = t.id;
        const cov = art(t, 'cov');
        const b = document.createElement('button');
        b.className = 'cplay';
        b.dataset.act = 'play';
        b.type = 'button';
        b.textContent = '▶';
        b.setAttribute('aria-label', 'Відтворити');
        cov.appendChild(b);
        const tt = document.createElement('div'); tt.className = 'ctt'; tt.textContent = t.title;
        const ta = document.createElement('div'); ta.className = 'cta'; ta.textContent = t.artist;
        el.append(cov, tt, ta);
        el.addEventListener('click', e => { if (!e.target.closest('.cplay')) openModal(t); });
        return el;
    }

    function trackRow(t) {
        const row = document.createElement('div');
        row.className = 'track';
        row.dataset.id = t.id;
        const ok = t.status === 'approved';
        const thumb = art(t, 'thumb');
        const tags = [
            '<span class="tag">♥ ' + (t.likes_count || 0) + '</span>',
            '<span class="tag">💬 ' + (t.comments_count || 0) + '</span>',
            '<span class="tag">' + (LICENSE_TEXT[t.license] || '') + '</span>',
            ok ? '' : '<span class="tag ' + t.status + '">' + (STATUS_TEXT[t.status] || '') + '</span>'
        ].join('');
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = '<div class="tt"></div><div class="ta"></div><div class="tags">' + tags + '</div>';
        meta.querySelector('.tt').textContent = t.title;
        meta.querySelector('.ta').textContent = t.artist + (t.album ? ' · ' + t.album : '');
        const play = document.createElement('button');
        play.className = 'play';
        play.dataset.act = 'play';
        play.type = 'button';
        play.textContent = '▶';
        play.disabled = !ok;
        row.append(play, thumb, meta);
        row.addEventListener('click', e => { if (!e.target.closest('.play')) openModal(t); });
        return row;
    }

    function renderList(rows) {
        shown = rows;
        const box = document.createElement('div');
        box.className = 'list';
        if (!rows.length) box.innerHTML = '<div class="empty">Нічого не знайдено.</div>';
        rows.forEach(t => box.appendChild(trackRow(t)));
        return box;
    }

    function renderAlbums() {
        const groups = new Map();
        approved.filter(t => t.album).forEach(t => {
            const key = t.album + '||' + t.artist;
            if (!groups.has(key)) groups.set(key, { album: t.album, artist: t.artist, tracks: [] });
            groups.get(key).tracks.push(t);
        });
        const wrap = document.createElement('div');
        if (openAlbum) {
            const g = groups.get(openAlbum);
            const back = document.createElement('div');
            back.className = 'back';
            back.textContent = '← До всіх альбомів';
            back.addEventListener('click', () => { openAlbum = null; load(); });
            wrap.appendChild(back);
            if (g) {
                const hd = document.createElement('div');
                hd.className = 'mart';
                hd.textContent = g.artist + ' · ' + g.tracks.length + ' тр.';
                wrap.appendChild(hd);
                wrap.appendChild(renderList(g.tracks));
            }
            return wrap;
        }
        if (!groups.size) { wrap.innerHTML = '<div class="empty">Альбомів поки немає. Вкажіть альбом при завантаженні треку.</div>'; return wrap; }
        const grid = document.createElement('div');
        grid.className = 'grid';
        groups.forEach((g, key) => {
            const first = g.tracks[0];
            const el = document.createElement('div');
            el.className = 'card';
            const cov = art(first, 'cov');
            const tt = document.createElement('div'); tt.className = 'ctt'; tt.textContent = g.album;
            const ta = document.createElement('div'); ta.className = 'cta'; ta.textContent = g.artist + ' · ' + g.tracks.length + ' тр.';
            el.append(cov, tt, ta);
            el.addEventListener('click', () => { openAlbum = key; load(); });
            grid.appendChild(el);
        });
        wrap.appendChild(grid);
        return wrap;
    }

    /* ---------- Завантаження даних і вкладки ---------- */
    async function fetchApproved() {
        const { data } = await sb.from('tracks').select('*').eq('status', 'approved').order('created_at', { ascending: false }).limit(300);
        approved = data || [];
    }

    async function fetchMine() {
        const { data } = await sb.from('tracks').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(100);
        return data || [];
    }

    async function fetchUserState() {
        liked = new Set(); follows = new Set();
        if (!user) return;
        const [l, f] = await Promise.all([
            sb.from('track_likes').select('track_id').eq('user_id', user.id),
            sb.from('artist_follows').select('artist').eq('user_id', user.id)
        ]);
        (l.data || []).forEach(x => liked.add(x.track_id));
        (f.data || []).forEach(x => follows.add(x.artist));
    }

    function setTabs() {
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    }

    async function load() {
        const content = $('content');
        content.innerHTML = '<div class="empty">Завантаження…</div>';
        $('recentSec').hidden = true;
        $('listTitle').textContent = { all: 'Усі треки', albums: 'Альбоми', follows: 'Підписки', mine: 'Мої треки', review: 'На перевірці' }[tab] || '';
        setTabs();

        if (tab === 'mine' || tab === 'review') {
            let rows;
            if (tab === 'mine') rows = await fetchMine();
            else {
                const { data } = await sb.from('tracks').select('*').eq('status', 'pending').order('created_at', { ascending: false });
                rows = data || [];
            }
            content.textContent = '';
            if (!rows.length) content.innerHTML = '<div class="empty">Тут поки порожньо.</div>';
            else content.appendChild(renderList(rows));
            shown = rows.filter(t => t.status === 'approved');
            return;
        }

        if (tab === 'albums') {
            content.textContent = '';
            content.appendChild(renderAlbums());
            return;
        }

        if (tab === 'follows') {
            if (!user) { content.innerHTML = '<div class="empty">Увійдіть, щоб бачити треки виконавців, на яких ви підписані.</div>'; return; }
            const rows = approved.filter(t => follows.has(t.artist));
            content.textContent = '';
            if (!rows.length) content.innerHTML = '<div class="empty">Ви ще ні на кого не підписані. Відкрийте трек і натисніть «Підписатись».</div>';
            else content.appendChild(renderList(rows));
            return;
        }

        // Усі треки
        content.textContent = '';
        const recent = approved.slice(0, 12);
        const rowBox = $('row');
        rowBox.textContent = '';
        recent.forEach(t => rowBox.appendChild(card(t)));
        $('recentSec').hidden = !recent.length;
        content.appendChild(renderList(approved));
        cur = -1;
        queue = approved.slice();
        setPlayingUI();
    }

    document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
        tab = b.dataset.tab;
        openAlbum = null;
        load();
    }));

    /* ---------- Дії у списках ---------- */
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-act="play"]');
        if (!b) return;
        const holder = b.closest('[data-id]');
        if (!holder) return;
        const t = approved.find(x => x.id === holder.dataset.id);
        if (!t) return;
        const i = queue.findIndex(x => x.id === t.id);
        if (i === cur && !audio.paused) audio.pause();
        else if (i === cur) audio.play();
        else { queue = shown.filter(x => x.status === 'approved'); playTrack(t); }
        e.stopPropagation();
    });

    /* ---------- Вікно треку ---------- */
    function btn(label, cls, act) {
        const b = document.createElement('button');
        b.className = 'btn ' + cls;
        b.textContent = label;
        b.dataset.act = act;
        return b;
    }

    async function openModal(t) {
        modalTrack = t;
        $('mCov').textContent = '';
        $('mCov').appendChild(art(t, 'mcov-in'));
        $('mTitle').textContent = t.title;
        $('mArtist').textContent = t.artist;
        $('mAlbum').textContent = t.album || '—';
        $('mStatus').textContent = STATUS_TEXT[t.status] || t.status;
        $('mLicense').textContent = LICENSE_TEXT[t.license] || t.license;
        $('mSize').textContent = t.size_mb + ' MB';
        $('mDate').textContent = new Date(t.created_at).toLocaleString('uk-UA');
        $('mDesc').textContent = t.description || 'Опису немає.';
        $('mLink').textContent = location.origin + location.pathname + '?t=' + t.id;

        const bs = $('mBtns');
        bs.textContent = '';
        if (t.status === 'approved') {
            const p = btn('▶ Слухати', '', 'play');
            bs.appendChild(p);
            const lk = btn((liked.has(t.id) ? '♥ ' : '♡ ') + (t.likes_count || 0), liked.has(t.id) ? 'on' : 'ghost', 'like');
            if (!user) lk.disabled = true;
            bs.appendChild(lk);
            if (user && t.artist) {
                const fl = btn(follows.has(t.artist) ? 'Відписатись' : 'Підписатись на ' + t.artist, 'ghost', 'follow');
                bs.appendChild(fl);
            }
        }
        bs.appendChild(btn('Копіювати посилання', 'ghost', 'copy'));
        if (isAdmin && t.status !== 'approved') bs.appendChild(btn('Схвалити', 'ok', 'approve'));
        if (isAdmin && t.status !== 'rejected') bs.appendChild(btn('Відхилити', 'ghost', 'reject'));
        if (user && (t.user_id === user.id || isAdmin)) bs.appendChild(btn('Видалити', 'danger', 'delete'));

        $('modalBg').hidden = false;
        await loadComments();
    }

    function closeModal() { $('modalBg').hidden = true; modalTrack = null; }
    $('mClose').addEventListener('click', closeModal);
    $('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

    async function loadComments() {
        const t = modalTrack;
        const list = $('mComList');
        list.innerHTML = '<div class="empty">Завантаження…</div>';
        const { data, error } = await sb.from('track_comments').select('*').eq('track_id', t.id).order('created_at', { ascending: true }).limit(200);
        if (error) { list.innerHTML = '<div class="empty">Помилка: ' + error.message.replace(/</g, '&lt;') + '</div>'; return; }
        $('mComCount').textContent = (data || []).length;
        list.textContent = '';
        if (!data || !data.length) list.innerHTML = '<div class="empty">Коментарів ще немає.</div>';
        (data || []).forEach(c => {
            const d = document.createElement('div');
            d.className = 'cm';
            d.innerHTML = '<b></b><span class="dt"></span><div class="cb"></div>';
            d.querySelector('b').textContent = c.author || 'гість';
            d.querySelector('.dt').textContent = new Date(c.created_at).toLocaleString('uk-UA');
            d.querySelector('.cb').textContent = c.body;
            if (user && (c.user_id === user.id || isAdmin)) {
                const del = document.createElement('button');
                del.textContent = 'Видалити';
                del.dataset.act = 'delcomment';
                del.dataset.id = c.id;
                d.appendChild(del);
            }
            list.appendChild(d);
        });
        const form = $('mComForm');
        form.textContent = '';
        if (!user) {
            form.innerHTML = '<div class="empty" style="padding:6px 0;">Увійдіть, щоб писати коментарі.</div>';
        } else {
            const wrap = document.createElement('div');
            wrap.className = 'cform';
            wrap.innerHTML = '<textarea maxlength="500" placeholder="Напишіть коментар…"></textarea><button class="btn small" type="button" data-act="sendcomment">Надіслати</button>';
            form.appendChild(wrap);
        }
    }

    async function modalAction(b) {
        const t = modalTrack;
        if (!t) return;
        const act = b.dataset.act;
        try {
            if (act === 'play') { closeModal(); playTrack(t); }
            else if (act === 'copy') {
                if (navigator.clipboard) await navigator.clipboard.writeText($('mLink').textContent);
                $('mLink').textContent = 'Посилання скопійовано: ' + $('mLink').textContent;
            } else if (act === 'like') {
                if (liked.has(t.id)) {
                    const { error } = await sb.from('track_likes').delete().eq('user_id', user.id).eq('track_id', t.id);
                    if (error) throw error;
                    liked.delete(t.id);
                } else {
                    const { error } = await sb.from('track_likes').insert({ user_id: user.id, track_id: t.id });
                    if (error) throw error;
                    liked.add(t.id);
                }
                await refreshTrack(t);
                openModal(modalTrack);
            } else if (act === 'follow') {
                if (follows.has(t.artist)) {
                    const { error } = await sb.from('artist_follows').delete().eq('user_id', user.id).eq('artist', t.artist);
                    if (error) throw error;
                    follows.delete(t.artist);
                } else {
                    const { error } = await sb.from('artist_follows').insert({ user_id: user.id, artist: t.artist });
                    if (error) throw error;
                    follows.add(t.artist);
                }
                openModal(modalTrack);
            } else if (act === 'approve' || act === 'reject') {
                const status = act === 'approve' ? 'approved' : 'rejected';
                const { error } = await sb.from('tracks').update({ status }).eq('id', t.id);
                if (error) throw error;
                closeModal();
                await fetchApproved();
                load();
            } else if (act === 'delete') {
                if (!confirm('Видалити трек із сайту?')) return;
                const { data: sess } = await sb.auth.getSession();
                const token = sess && sess.session ? sess.session.access_token : '';
                const res = await fetch(worker() + '/music/delete', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: t.id })
                });
                const out = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(out.error || ('код ' + res.status));
                if (t.cover_path) await sb.storage.from(CFG.SUPABASE_BUCKET).remove([t.cover_path]);
                closeModal();
                await fetchApproved();
                load();
            } else if (act === 'sendcomment') {
                if (!user) return;
                const ta = $('mComForm').querySelector('textarea');
                const body = ta.value.trim();
                if (!body) return;
                const { error } = await sb.from('track_comments').insert({ track_id: t.id, user_id: user.id, author: who(), body });
                if (error) throw error;
                ta.value = '';
                await refreshTrack(t);
                loadComments();
            } else if (act === 'delcomment') {
                if (!confirm('Видалити коментар?')) return;
                const { error } = await sb.from('track_comments').delete().eq('id', b.dataset.id);
                if (error) throw error;
                await refreshTrack(t);
                loadComments();
            }
        } catch (err) {
            alert('Помилка: ' + err.message);
        }
    }

    async function refreshTrack(t) {
        const { data } = await sb.from('tracks').select('likes_count,comments_count').eq('id', t.id).maybeSingle();
        if (data) {
            t.likes_count = data.likes_count;
            t.comments_count = data.comments_count;
        }
    }

    $('modalBg').addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (b) modalAction(b);
    });

    /* ---------- Обкладинка ---------- */
    function compressCover(file) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const S = 400;
                const side = Math.min(img.width, img.height);
                const c = document.createElement('canvas');
                c.width = S; c.height = S;
                c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
                c.toBlob(b => b ? resolve(b) : reject(new Error('стиснення не вдалося')), 'image/jpeg', 0.75);
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('це не зображення')); };
            img.src = url;
        });
    }

    /* ---------- Завантаження треку ---------- */
    $('toggleUpload').addEventListener('click', () => { $('uploadCard').hidden = !$('uploadCard').hidden; });

    $('uploadForm').addEventListener('submit', async e => {
        e.preventDefault();
        if (!user) { uploadMsg('Увійдіть в акаунт на головній сторінці.'); return; }
        const file = $('file').files[0];
        const title = $('title').value.trim();
        const artist = $('artist').value.trim();
        const album = $('album').value.trim().slice(0, 120);
        const description = $('description').value.trim().slice(0, 1000);
        const license = $('license').value;
        if (!file) { uploadMsg('Оберіть MP3-файл.'); return; }
        if (!/\.mp3$/i.test(file.name) && file.type !== 'audio/mpeg') { uploadMsg('Потрібен файл MP3.'); return; }
        const mb = file.size / 1048576;
        if (mb > MAX_MB) { uploadMsg('Файл завеликий. Максимум ' + MAX_MB + ' MB.'); return; }
        if (!title || !artist) { uploadMsg('Вкажіть назву і виконавця.'); return; }
        if (!$('rights').checked) { uploadMsg('Потрібно підтвердити право на файл.'); return; }
        if (!worker()) { uploadMsg('Сервіс музики ще не підключено.'); return; }

        let coverBlob = null;
        const cf = $('cover').files[0];
        if (cf) {
            try { coverBlob = await compressCover(cf); }
            catch (err) { uploadMsg('Обкладинка: ' + err.message); return; }
        }
        const total = mb + (coverBlob ? coverBlob.size / 1048576 : 0);

        const { data: mine } = await sb.from('tracks').select('size_mb').eq('user_id', user.id);
        const used = (mine || []).reduce((s, t) => s + parseFloat(t.size_mb || 0), 0);
        if (used + total > QUOTA_MB) { uploadMsg('Немає місця (ліміт ' + QUOTA_MB + ' MB). Видаліть старі треки.'); return; }

        $('btnUpload').disabled = true;
        uploadMsg('Завантажуємо…', true);
        try {
            const { data: sess } = await sb.auth.getSession();
            const token = sess && sess.session ? sess.session.access_token : '';
            const res = await fetch(worker() + '/music/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'audio/mpeg',
                    'X-Title': encodeURIComponent(title),
                    'X-Artist': encodeURIComponent(artist),
                    'X-License': license
                },
                body: file
            });
            const out = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(out.error || ('код ' + res.status));

            // Альбом, опис і обкладинка — окремим оновленням (трек ще на перевірці, власник може оновити)
            const patch = { album, description };
            if (coverBlob && out.track && out.track.id) {
                const cp = user.id + '/covers/' + out.track.id + '.jpg';
                const { error: ce } = await sb.storage.from(CFG.SUPABASE_BUCKET).upload(cp, coverBlob, { contentType: 'image/jpeg' });
                if (!ce) patch.cover_path = cp;
            }
            if (out.track && out.track.id) {
                await sb.from('tracks').update(patch).eq('id', out.track.id);
            }

            $('file').value = ''; $('cover').value = ''; $('title').value = ''; $('artist').value = '';
            $('album').value = ''; $('description').value = ''; $('rights').checked = false;
            uploadMsg('Надіслано на перевірку ✅', true);
            tab = 'mine';
            $('uploadCard').hidden = true;
            load();
        } catch (err) {
            uploadMsg('Помилка: ' + err.message);
        } finally {
            $('btnUpload').disabled = false;
        }
    });

    /* ---------- Старт ---------- */
    async function init() {
        const { data } = await sb.auth.getSession();
        user = data && data.session ? data.session.user : null;
        isAdmin = false;
        if (user) {
            const { data: adm } = await sb.from('music_admins').select('email').eq('email', user.email).maybeSingle();
            isAdmin = !!adm;
        }
        $('who').textContent = user ? user.email : 'Гість';
        $('guestHint').hidden = !!user;
        $('tabFollows').hidden = !user;
        $('tabMine').hidden = !user;
        $('tabReview').hidden = !isAdmin;
        $('toggleUpload').hidden = !user;
        await fetchApproved();
        await fetchUserState();

        // Посилання ?t=ID відкриває трек одразу
        const want = new URLSearchParams(location.search).get('t');
        if (want) {
            const t = approved.find(x => x.id === want);
            if (t) openModal(t);
        }
        load();
    }
    init();
})();
</script>
