<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a4a84">
    <title>Acore Карти</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f5f7; color: #333; }

        header { background: #1a4a84; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .logo { font-size: 20px; font-weight: bold; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: white; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }

        .controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .search-box { display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: #1a4a84; box-shadow: 0 0 0 3px rgba(26,74,132,0.1); }
        .search-box button { padding: 10px 20px; background: #1a4a84; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .search-box button:hover { background: #0056b3; }

        .cities { margin-top: 12px; }
        .cities-title { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 8px; }
        .city-btn { display: inline-block; padding: 6px 12px; background: #eef2f5; border: 1px solid #ccc; border-radius: 20px; font-size: 12px; margin-right: 6px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; }
        .city-btn:hover { background: #1a4a84; color: white; }

        #map { height: 500px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        footer { text-align: center; padding: 15px; color: #999; font-size: 12px; margin-top: 20px; }

        .leaflet-popup-content { font-size: 13px; line-height: 1.4; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🗺️ Acore Карти</div>
        <div class="nav-links">
            <a href="index.html">← На головну</a>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Шукати місцевість (назва)...">
                <button onclick="searchLocation()">Шукати</button>
            </div>

            <div class="cities">
                <div class="cities-title">🇺🇦 Популярні міста України:</div>
                <button class="city-btn" onclick="goToCity(49.4444, 32.0598, 'Черкаси')">Черкаси</button>
                <button class="city-btn" onclick="goToCity(50.4501, 30.5234, 'Київ')">Київ</button>
                <button class="city-btn" onclick="goToCity(49.5832, 34.8008, 'Полтава')">Полтава</button>
                <button class="city-btn" onclick="goToCity(48.0, 37.8, 'Донецьк')">Донецьк</button>
                <button class="city-btn" onclick="goToCity(49.6, 36.6, 'Харків')">Харків</button>
                <button class="city-btn" onclick="goToCity(46.4775, 30.7326, 'Одеса')">Одеса</button>
                <button class="city-btn" onclick="goToCity(49.8, 24.0, 'Львів')">Львів</button>
                <button class="city-btn" onclick="goToCity(48.5, 25.3, 'Івано-Франківськ')">Івано-Франківськ</button>
                <button class="city-btn" onclick="goToCity(50.63, 26.25, 'Рівне')">Рівне</button>
                <button class="city-btn" onclick="goToCity(51.5, 31.3, 'Чернігів')">Чернігів</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <footer>
        Карти через OpenStreetMap • Acore Corp ©2026
    </footer>

    <script>
        // Ініціалізація карти (Черкаси, обласний центр)
        const map = L.map('map').setView([49.4444, 32.0598], 12);

        // OpenStreetMap слой
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // Маркер для Черкас
        const marker = L.marker([49.4444, 32.0598]).addTo(map)
            .bindPopup('<b>Черкаси</b><br>Помірний клімат, красива природа 🌳');

        // Геолокація користувача (якщо дозволено)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const { latitude, longitude } = pos.coords;
                    const userMarker = L.marker([latitude, longitude]).addTo(map)
                        .bindPopup('<b>Ваша позиція 📍</b>');
                    map.setView([latitude, longitude], 12);
                },
                err => console.log('Геолокація не доступна')
            );
        }

        // Функції
        function goToCity(lat, lng, name) {
            map.setView([lat, lng], 12);
            L.marker([lat, lng]).addTo(map).bindPopup(`<b>${name}</b>`).openPopup();
        }

        function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Запит "Черкаси" = обласний центр (без плутанини з селами)
            const city = (window.ACORE_CONFIG && window.ACORE_CONFIG.CITY_DEFAULT) || { name: 'Черкаси', lat: 49.4444, lon: 32.0598 };
            if (query.toLowerCase() === city.name.toLowerCase()) {
                showPlace(city.lat, city.lon, city.name + ', Черкаська область');
                return;
            }

            // Пошук тільки в Україні; спершу міста, потім інші результати
            const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) +
                '&format=json&limit=5&countrycodes=ua&accept-language=uk';
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (!data.length) { alert('Місцевість не знайдена'); return; }
                    const best = data.find(d => ['city', 'town'].includes(d.type)) || data[0];
                    showPlace(parseFloat(best.lat), parseFloat(best.lon), best.display_name);
                })
                .catch(() => alert('Помилка при пошуку'));
        }

        function showPlace(lat, lon, name) {
            map.setView([lat, lon], 12);
            L.marker([lat, lon]).addTo(map).bindPopup('<b>' + name + '</b>').openPopup();
        }

        // Enter для пошуку
        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchLocation();
        });
    </script>
</body>
</html>
