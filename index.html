<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a4a84">
    <title>Acore - Веб-платформа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { background-color: #f4f5f7; color: #333; }

        header { background: #1a4a84; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .logo { font-size: 18px; font-weight: bold; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 12px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.2s; text-decoration: none; display: inline-block; }
        .tab-btn:hover, .tab-btn.active { background: rgba(255,255,255,0.4); }

        .container { display: flex; height: calc(100vh - 50px); overflow: hidden; }

        .sidebar { width: 200px; background: white; border-right: 1px solid #ddd; overflow-y: auto; }
        .sidebar-item { padding: 10px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .sidebar-item:hover { background: #f8f9fa; }
        .sidebar-item.active { background: #e8f0ff; color: #1a4a84; font-weight: bold; }

        .content { flex: 1; overflow-y: auto; padding: 15px; }

        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .card h3 { margin-bottom: 12px; color: #1a4a84; font-size: 16px; }

        .chat-box { height: 300px; border: 1px solid #ccc; border-radius: 6px; padding: 10px; overflow-y: auto; background: #f8f9fa; margin-bottom: 10px; font-size: 12px; }
        .chat-line { margin: 6px 0; padding: 6px; background: white; border-radius: 4px; }

        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"], input[type="password"], input[type="email"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        button { padding: 8px 16px; background: #1a4a84; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        button:hover { background: #0056b3; }

        .hidden { display: none; }

        footer { text-align: center; padding: 8px; font-size: 11px; color: #999; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🚀 Acore 2.0</div>
        <div class="nav-links">
            <a href="search.html" class="tab-btn">🔍 Пошук</a>
            <a href="maps.html" class="tab-btn">🗺️ Карти</a>
            <a href="cloud.html" class="tab-btn">☁️ Облако</a>
        </div>
    </header>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-item active" onclick="switchTab('news')">📰 Новини</div>
            <div class="sidebar-item" onclick="switchTab('chat')">🤖 Чат AI</div>
            <div class="sidebar-item" onclick="switchTab('tools')">⚙️ Інструменти</div>
        </div>

        <div class="content">
            <!-- НОВИНИ -->
            <div id="tab-news" class="tab-content">
                <div class="card">
                    <h3>📰 Головні новини</h3>
                    <div id="news-list">Завантаження новин...</div>
                </div>
            </div>

            <!-- ЧАТ -->
            <div id="tab-chat" class="tab-content hidden">
                <div class="card">
                    <h3>🤖 Чат з Groq AI</h3>
                    
                    <div style="background: #fff3cd; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                        <input type="password" id="groqKeyInput" placeholder="Введіть Groq ключ (gsk_...)" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px;">
                        <button onclick="saveGroqKey()" style="width: 100%;">💾 Зберегти ключ</button>
                    </div>

                    <div id="chatBox" class="chat-box"></div>

                    <div class="input-group">
                        <input type="text" id="chatInput" placeholder="Твоє питання..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()">Надіслати</button>
                        <button onclick="clearChat()" style="background: #6c757d;">Очистити</button>
                    </div>
                </div>
            </div>

            <!-- ІНСТРУМЕНТИ -->
            <div id="tab-tools" class="tab-content hidden">
                <div class="card">
                    <h3>⚙️ Інструменти</h3>
                    <p>🔧 Погода, валюти, ігри (coming soon)</p>
                </div>
            </div>
        </div>
    </div>

    <footer>Acore Corp ©2026 • Українська веб-платформа</footer>

    <script src="js/config.js"></script>
    <script src="js/groq-client.js"></script>

    <script>
        let groqApiKey = localStorage.getItem('groq_api_key') || '';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }

        function saveGroqKey() {
            const key = document.getElementById('groqKeyInput').value.trim();
            if (!key.startsWith('gsk_')) {
                alert('❌ Ключ повинен починатися з gsk_');
                return;
            }
            localStorage.setItem('groq_api_key', key);
            groqApiKey = key;
            document.getElementById('groqKeyInput').value = '***';
            alert('✅ Збережено!');
        }

        async function sendChatMessage() {
            if (!groqApiKey) {
                alert('❌ Введіть Groq ключ');
                return;
            }

            const message = document.getElementById('chatInput').value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="chat-line"><strong>Ти:</strong> ${message}</div>`;
            document.getElementById('chatInput').value = '';

            const result = await GroqChat.ask(message, groqApiKey);
            
            if (result.error) {
                chatBox.innerHTML += `<div class="chat-line" style="background: #f8d7da;">❌ ${result.error}</div>`;
            } else {
                chatBox.innerHTML += `<div class="chat-line" style="background: #d1ecf1;"><strong>AI:</strong> ${result.reply}</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chatBox').innerHTML = '';
            GroqChat.clear();
        }

        window.addEventListener('load', () => {
            if (groqApiKey) {
                document.getElementById('groqKeyInput').value = '***';
            }

            // Завантажити новини (демо)
            const newsList = document.getElementById('news-list');
            newsList.innerHTML = `
                <div style="background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 8px;">
                    <strong>📰 Новина 1</strong><br>
                    <small>Цікава новина про eventos...</small>
                </div>
                <div style="background: #f0f0f0; padding: 10px; border-radius: 4px;">
                    <strong>📰 Новина 2</strong><br>
                    <small>Ще одна importante noticia...</small>
                </div>
            `;
        });
    </script>
</body>
</html>
