<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acore AI Search — Все для вас</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(22, 30, 46, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-group { display: flex; align-items: baseline; gap: 8px; }
        .logo { font-size: 24px; font-weight: 700; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .slogan { font-size: 13px; color: var(--text-secondary); font-style: italic; }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #e2e8f0;
        }

        .message a {
            color: #38bdf8;
            text-decoration: underline;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .chat-input-area button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="logo-group">
            <div class="logo">Acore AI</div>
            <div class="slogan">Все для вас</div>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary);" id="header-date"></div>
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message ai">Вітаю! Я — **Acore AI Search**, ваш пошуковий асистент. Поставите запитання?</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Введіть запит для пошуку..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Надіслати</button>
    </div>
</div>

<script>
    // Зашифрований ключ Groq API
    const B64_GROQ_KEY = "Z3NrX2NlTURiU005WVFIRW9GQzZzWnpPV0dkeWIzRllpNWtvY2VvODJUaXFVbTlwQTBFdm56WTQ=";
    const getGroqKey = () => atob(B64_GROQ_KEY);

    document.getElementById('header-date').innerText = new Date().toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' });

    const SYSTEM_PROMPT = `Ти — пошукова система та штучний інтелект Acore AI Search (проєкт Acore).
Твої правила відповідей:
1. Завжди представляйся як Acore AI Search або Acore AI.
2. Відповідай виключно українською мовою.
3. Надавай чітку, структуровану та корисну відповідь.
4. В кінці відповіді або по тексту ОБОВ'ЯЗКОВО додавай відомі посилання/джерела (наприклад: [Офіційний сайт](https://...) або [Джерело](https://...)).
5. Використовуй Markdown форматування.`;

    let chatHistory = [
        { role: "system", content: SYSTEM_PROMPT }
    ];

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const query = inputField.value.trim();
        if (!query) return;

        appendMessage(query, 'user');
        inputField.value = '';

        chatHistory.push({ role: "user", content: query });

        const loadingId = appendMessage('🤖 Acore AI шукає інформацію...', 'ai');

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getGroqKey()}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: chatHistory,
                    temperature: 0.6
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'Помилка API');
            }

            let aiAnswer = data.choices[0].message.content;

            // Перетворення Markdown-посилань [текст](URL) у реальні HTML-посилання
            const formattedAnswer = aiAnswer.replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            document.getElementById(loadingId).innerHTML = formattedAnswer;
            chatHistory.push({ role: "assistant", content: aiAnswer });

        } catch (err) {
            console.error(err);
            document.getElementById(loadingId).innerText = "❌ Помилка: " + err.message;
        }
    }

    function appendMessage(text, side) {
        const chat = document.getElementById('chat-messages');
        const msg = document.createElement('div');
        const id = 'msg-' + Date.now();
        msg.id = id;
        msg.className = `message ${side}`;
        msg.innerText = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return id;
    }
</script>

</body>
</html>
