<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acore — NextGen Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(22, 30, 46, 0.7);
            --bg-card-hover: rgba(30, 41, 61, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
        }

        /* --- Header / Hero --- */
        header {
            padding: 40px 20px 20px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .search-container {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 6px;
            display: flex;
            gap: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .search-container input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 15px;
        }

        .search-container input::placeholder { color: var(--text-secondary); }

        .btn-action {
            border: none;
            padding: 12px 22px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ai {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-ai:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-google {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .btn-google:hover { background: rgba(255, 255, 255, 0.12); }

        /* --- Main Layout --- */
        .dashboard {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .card:hover { border-color: rgba(255, 255, 255, 0.15); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Mail Section --- */
        .mail-form input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
            font-size: 13px;
            outline: none;
        }

        .mail-form input:focus { border-color: #6366f1; }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .mail-toggle {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
        }

        .mail-toggle:hover { color: var(--text-primary); }

        /* --- News Section --- */
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .news-item:last-child { border-bottom: none; }

        .news-item a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            display: block;
            transition: color 0.2s;
        }

        .news-item a:hover { color: #818cf8; }

        .news-item .time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* --- AI Response Card --- */
        #ai-response-card {
            display: none;
            background: linear-gradient(180deg, rgba(30, 27, 75, 0.5) 0%, rgba(15, 23, 42, 0.5) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        #ai-response-text {
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        /* --- Widgets --- */
        .widget-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .widget-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @media (max-width: 992px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">Acore</div>
        <div class="brand-subtitle">Розумний інформаційний хаб</div>

        <div class="search-container">
            <input type="text" id="search-query" placeholder="Сформулюйте запит або пошукайте..." required>
            <button class="btn-action btn-ai" onclick="askAI()">Acore AI</button>
            <button class="btn-action btn-google" onclick="searchGoogle()">Google</button>
        </div>
    </header>

    <div class="dashboard">
        <!-- Ліва колонка -->
        <aside>
            <div class="card">
                <div class="card-header">
                    <span class="card-title" id="mail-title">⚡ Acore Mail</span>
                </div>
                <div class="mail-form" id="mail-box">
                    <div id="login-mode">
                        <input type="text" id="login-email" placeholder="Логін (@acore.ua)">
                        <input type="password" id="login-pass" placeholder="Пароль">
                        <button class="btn-primary" onclick="loginMail()">Увійти</button>
                        <div class="mail-toggle" onclick="toggleMailMode('register')">Створити акаунт</div>
                    </div>

                    <div id="register-mode" style="display: none;">
                        <input type="text" id="reg-name" placeholder="Ваше ім'я">
                        <div style="display:flex; gap:6px;">
                            <input type="text" id="reg-login" placeholder="Логін" style="width:60%;">
                            <select id="reg-domain" style="width:40%; background:rgba(0,0,0,0.2); border:1px solid var(--border); color:white; border-radius:10px; padding:0 8px; font-size:12px; margin-bottom:10px;">
                                <option value="@acore.ua" style="background:#111;">@acore.ua</option>
                            </select>
                        </div>
                        <input type="password" id="reg-pass" placeholder="Пароль">
                        <button class="btn-primary" style="background:var(--accent-gradient);" onclick="registerMail()">Зареєструватися</button>
                        <div class="mail-toggle" onclick="toggleMailMode('login')">Вже є акаунт?</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">📈 Курс валют (НБУ)</span>
                </div>
                <div id="rates">
                    <div class="widget-sub">Завантаження...</div>
                </div>
            </div>
        </aside>

        <!-- Центральна колонка -->
        <main>
            <div class="card" id="ai-response-card">
                <div class="card-header">
                    <span class="card-title">🤖 Acore AI Assitant</span>
                </div>
                <div id="ai-response-text"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">📰 Актуальні новини</span>
                </div>
                <div id="news-container">Завантаження новин...</div>
            </div>
        </main>

        <!-- Права колонка -->
        <aside>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">🌤 Погода</span>
                </div>
                <div id="weather">
                    <div class="widget-sub">Завантаження...</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const B64_JSONBIN = "JDJhJDEwJHlXYk9nUVVZV0NzM0tIVzRXUGF6MHVMZE5MUm1GNnd2WlNpejFvS3E5VjZnVEtVcGZhaVFP";
        const B64_OPENROUTER = "c2stb3ItdjEtNDA1NjkzYjk3ZGI1ZDI0MjI3M2JmOGVkMDRjMTgyZjIxOGM4ODEzMjY1YmZhZDMzODg1M2ZiNWVlMDFiNDY5Mw==";

        const getJsonbinKey = () => atob(B64_JSONBIN);
        const getOpenRouterKey = () => atob(B64_OPENROUTER);

        function searchGoogle() {
            const query = document.getElementById('search-query').value;
            if (query.trim()) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
            }
        }

        async function askAI() {
            const query = document.getElementById('search-query').value.trim();
            if (!query) return;

            const aiCard = document.getElementById('ai-response-card');
            const aiText = document.getElementById('ai-response-text');

            aiCard.style.display = 'block';
            aiText.innerText = 'Аналізую запит...';

            const freeModels = [
                "nvidia/nemotron-3.5-lightning:free",
                "nex-agi/nex-n2.5-mini:free",
                "inclusionai/ling-3.0-flash-vl:free",
                "nex-agi/nex-n2.5-pro:free"
            ];

            let success = false;

            for (const model of freeModels) {
                try {
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${getOpenRouterKey()}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                { role: "system", content: "Ти — корисний помічник Acore. Відповідай українською мовою чітко та коротко." },
                                { role: "user", content: query }
                            ]
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || 'Помилка');

                    aiText.innerText = data.choices[0].message.content;
                    success = true;
                    break;
                } catch (error) {
                    console.warn(`Модель ${model} недоступна, спроба наступної...`);
                }
            }

            if (!success) {
                aiText.innerText = '❌ Помилка отримання відповіді. Спробуйте пізніше.';
            }
        }

        function toggleMailMode(mode) {
            if (mode === 'register') {
                document.getElementById('login-mode').style.display = 'none';
                document.getElementById('register-mode').style.display = 'block';
                document.getElementById('mail-title').innerText = '⚡ Реєстрація';
            } else {
                document.getElementById('register-mode').style.display = 'none';
                document.getElementById('login-mode').style.display = 'block';
                document.getElementById('mail-title').innerText = '⚡ Acore Mail';
            }
        }

        async function registerMail() {
            const name = document.getElementById('reg-name').value.trim();
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const domain = document.getElementById('reg-domain').value;

            if (!name || !login || !pass) return alert('Заповніть всі поля!');

            const fullEmail = login + domain;
            const userData = { name, email: fullEmail, pass, createdAt: new Date().toISOString() };

            try {
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': getJsonbinKey(),
                        'X-Bin-Name': `user_${fullEmail}`
                    },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    alert(`Скриньку ${fullEmail} створено!`);
                    toggleMailMode('login');
                    document.getElementById('login-email').value = fullEmail;
                }
            } catch (error) {
                alert('Помилка реєстрації.');
            }
        }

        function loginMail() {
            const email = document.getElementById('login-email').value.trim();
            if (email) {
                document.getElementById('mail-box').innerHTML = `
                    <div style="font-weight:600; font-size:14px; color:#10b981;">Вітаємо!</div>
                    <div style="font-size:12px; color:var(--text-secondary); margin:4px 0 12px 0;">${email}</div>
                    <button class="btn-primary" style="background:rgba(239, 68, 68, 0.2); color:#f87171;" onclick="location.reload()">Вийти</button>
                `;
            }
        }

        async function fetchNews() {
            try {
                const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.pravda.com.ua/rss/');
                const data = await res.json();
                const container = document.getElementById('news-container');
                container.innerHTML = '';

                data.items.slice(0, 8).forEach(item => {
                    const pubDate = new Date(item.pubDate).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
                    container.innerHTML += `
                        <div class="news-item">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                            <div class="time">${pubDate}</div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('news-container').innerText = 'Не вдалося завантажити новини.';
            }
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=49.44&longitude=32.06&current_weather=true');
                const data = await res.json();
                const temp = data.current_weather.temperature;
                document.getElementById('weather').innerHTML = `
                    <div class="widget-val">${temp}°C</div>
                    <div class="widget-sub">Черкаси</div>
                `;
            } catch (e) {
                document.getElementById('weather').innerText = 'Помилка.';
            }
        }

        async function fetchRates() {
            try {
                const res = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
                const data = await res.json();
                const usd = data.find(c => c.cc === 'USD').rate.toFixed(2);
                const eur = data.find(c => c.cc === 'EUR').rate.toFixed(2);
                document.getElementById('rates').innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span class="widget-sub">USD</span>
                        <span style="font-weight:600;">${usd} ₴</span>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span class="widget-sub">EUR</span>
                        <span style="font-weight:600;">${eur} ₴</span>
                    </div>
                `;
            } catch (e) {
                document.getElementById('rates').innerText = 'Помилка.';
            }
        }

        fetchNews();
        fetchWeather();
        fetchRates();
    </script>
</body>
</html>
