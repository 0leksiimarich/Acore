<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a4a84">
    <title>Acore Пошук</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f5f7; color: #333; overflow-x: hidden; }

        header { background: #1a4a84; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .logo { font-size: 20px; font-weight: bold; letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: white; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
        
        .search-header { text-align: center; margin-bottom: 30px; }
        .search-title { font-size: 32px; font-weight: bold; color: #1a4a84; margin-bottom: 20px; }

        .search-box { display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s; }
        .search-box input:focus { border-color: #1a4a84; box-shadow: 0 0 0 3px rgba(26,74,132,0.1); }
        .search-box button { padding: 12px 28px; background: #1a4a84; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .search-box button:hover { background: #0056b3; }

        .results { margin-top: 25px; }
        .result-item { background: white; padding: 16px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .result-title { color: #1a4a84; font-size: 16px; font-weight: bold; text-decoration: none; display: block; margin-bottom: 6px; }
        .result-title:hover { text-decoration: underline; }
        .result-url { color: #008000; font-size: 12px; margin-bottom: 4px; }
        .result-snippet { color: #666; font-size: 13px; line-height: 1.5; }

        .loading { text-align: center; padding: 20px; color: #666; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #eee; border-top: 3px solid #1a4a84; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .no-results { text-align: center; color: #999; padding: 30px; font-size: 14px; }

        footer { text-align: center; padding: 20px; color: #999; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔍 Acore Пошук</div>
        <div class="nav-links">
            <a href="index.html">← На головну</a>
        </div>
    </header>

    <div class="container">
        <div class="search-header">
            <h1 class="search-title">Пошук в Інтернеті</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Введіть пошуковий запит..." onkeypress="if(event.key==='Enter') search()">
                <button onclick="search()">Пошук</button>
            </div>
        </div>

        <div class="results" id="resultsContainer"></div>
    </div>

    <footer>
        Пошук через DuckDuckGo API • Acore Corp ©2026
    </footer>

    <script>
        const API_URL = 'https://api.duckduckgo.com/';

        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Пошук...</p></div>';

            fetch(`${API_URL}?q=${encodeURIComponent(query)}&format=json&no_html=1&no_redirect=1`)
                .then(res => res.json())
                .then(data => {
                    let html = '';

                    if (data.AbstractText) {
                        html += `<div class="result-item">
                            <div class="result-title">${data.Heading || query}</div>
                            <div class="result-snippet">${data.AbstractText}</div>
                        </div>`;
                    }

                    if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                        data.RelatedTopics.forEach(item => {
                            if (item.FirstURL && item.Text) {
                                html += `<div class="result-item">
                                    <a href="${item.FirstURL}" target="_blank" class="result-title">${item.Text.split('—')[0]}</a>
                                    <div class="result-url">${new URL(item.FirstURL).hostname}</div>
                                    <div class="result-snippet">${item.Text.substring(0, 150)}...</div>
                                </div>`;
                            }
                        });
                    }

                    if (!html) {
                        html = '<div class="no-results">❌ Результатів не знайдено</div>';
                    }

                    resultsContainer.innerHTML = html;
                })
                .catch(err => {
                    resultsContainer.innerHTML = '<div class="no-results">⚠️ Помилка при пошуку. Спробуйте ще раз.</div>';
                    console.error('Search error:', err);
                });
        }

        document.getElementById('searchInput').focus();
    </script>
</body>
</html>
