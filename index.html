<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acore — Все для вас</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка сайту */
        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .header-logo img {
            height: 45px;
            width: auto;
            border-radius: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Головна контейнер-сітка */
        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            flex: 1;
        }

        /* Бійчні віджети */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .widget {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
        }

        .widget h4 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .widget-content {
            font-size: 14px;
            line-height: 1.5;
        }

        /* Центральна частина */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Герой-блок з великим логотипом та пошуком */
        .hero-section {
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 140px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.2);
        }

        .slogan {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #58a6ff;
        }

        .search-box button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #238636;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background-color: #2ea043;
        }

        /* Блок AI Відповіді */
        .ai-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            display: none;
        }

        .ai-card h3 {
            color: #58a6ff;
            margin-bottom: 8px;
            font-size: 16px;
        }

        /* Новини */
        .news-section h3 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #f0f6fc;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-item {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #c9d1d9;
            transition: 0.2s;
        }

        .news-item:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-size: 13px;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <a href="#" class="header-logo">
            <img src="logo.jpg" alt="Acore Logo">
            <span class="header-title">Acore</span>
        </a>
    </header>

    <!-- Основний контент -->
    <div class="main-container">
        
        <!-- Ліва панель з віджетами -->
        <aside class="sidebar">
            <div class="widget">
                <h4>🌤 Погода (Київ)</h4>
                <div class="widget-content" id="weather-widget">Завантаження...</div>
            </div>

            <div class="widget">
                <h4>💳 Курс валют (НБУ)</h4>
                <div class="widget-content" id="currency-widget">
                    USD: 41.50 грн<br>
                    EUR: 45.20 грн
                </div>
            </div>
        </aside>

        <!-- Центральний блок -->
        <main class="content-area">
            
            <!-- Пошук та Логотип -->
            <section class="hero-section">
                <img src="logo.jpg" alt="Acore Все для вас" class="main-logo">
                <div class="slogan">Портал новин та пошуку «Все для вас»</div>
                
                <div class="search-box">
                    <input type="text" id="search-query" placeholder="Запитайте у Acore AI або введіть пошуковий запит...">
                    <button onclick="askAcoreAI()">Шукати</button>
                </div>
            </section>

            <!-- Карточка відповідей ШІ -->
            <section class="ai-card" id="ai-response-card">
                <h3>🤖 Відповідь Acore AI</h3>
                <div id="ai-response-text">Зачекайте, відповідь генерується...</div>
            </section>

            <!-- Блок Новин -->
            <section class="news-section">
                <h3>Головні новини України</h3>
                <div class="news-list" id="news-container">
                    <div class="news-item">Завантаження новин...</div>
                </div>
            </section>

        </main>
    </div>

    <!-- Підвал -->
    <footer>
        &copy; 2026 Acore.net.ua — Всі права захищено.
    </footer>

    <script>
        // Кодування ключа у Base64 (вставте свій encoded ключ)
        const B64_OPENROUTER = ""; 

        async function askAcoreAI() {
            const query = document.getElementById('search-query').value.trim();
            if (!query) return;

            const aiCard = document.getElementById('ai-response-card');
            const aiText = document.getElementById('ai-response-text');

            aiCard.style.display = 'block';
            aiText.innerText = '🤖 Acore AI шукає відповідь...';

            if(!B64_OPENROUTER) {
                aiText.innerText = '⚠️ Не вказано API ключ OpenRouter у змінній B64_OPENROUTER.';
                return;
            }

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${atob(B64_OPENROUTER)}`
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.0-flash-lite-001:free",
                        messages: [
                            { role: "system", content: "Ти — помічник пошукового порталу Acore. Відповідай українською мовою." },
                            { role: "user", content: query }
                        ]
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || `Помилка ${response.status}`);

                aiText.innerText = data.choices[0].message.content;
            } catch (error) {
                aiText.innerText = `❌ Помилка: ${error.message}`;
            }
        }
    </script>
</body>
</html>
