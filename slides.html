<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a4a84">
<title>A-Presentation</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: #e9ecf1; color: #222; overflow: hidden; }
    button, select, input { font-family: inherit; font-size: 13px; }

    /* Заголовок */
    .titlebar { background: #1a4a84; color: #fff; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; flex-shrink: 0; }
    .titlebar .app { font-weight: 700; font-size: 14px; white-space: nowrap; }
    .titlebar input { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 4px; padding: 5px 8px; width: 260px; outline: none; }
    .titlebar input:focus { background: rgba(255,255,255,.25); }
    .titlebar a { color: #fff; text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 4px; background: rgba(255,255,255,.15); white-space: nowrap; }
    .titlebar .saved { margin-left: auto; font-size: 12px; opacity: .8; white-space: nowrap; }

    /* Стрічка */
    .ribbon-tabs { background: #f3f3f3; border-bottom: 1px solid #d0d0d0; display: flex; gap: 2px; padding: 4px 8px 0; flex-shrink: 0; }
    .ribbon-tabs button { background: none; border: none; padding: 6px 12px; cursor: pointer; border-bottom: 2px solid transparent; color: #444; font-weight: 600; }
    .ribbon-tabs button.on { color: #1a4a84; border-bottom-color: #1a4a84; background: #fff; border-radius: 4px 4px 0 0; }
    .ribbon { background: #fff; border-bottom: 1px solid #d0d0d0; height: 84px; padding: 6px 10px; display: flex; gap: 6px; align-items: stretch; flex-shrink: 0; overflow-x: auto; }
    .ribbon .panel { display: none; gap: 6px; align-items: stretch; }
    .ribbon .panel.on { display: flex; }
    .group { display: flex; flex-direction: column; justify-content: space-between; padding: 0 8px 2px; border-right: 1px solid #e3e3e3; min-width: max-content; }
    .group .gl { font-size: 11px; color: #777; text-align: center; margin-top: 4px; }
    .group .gb { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; }
    .rb { background: #fff; border: 1px solid transparent; border-radius: 4px; padding: 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; color: #222; }
    .rb:hover { background: #eef3fa; border-color: #c9d6e8; }
    .rb.on { background: #d8e5f5; border-color: #8fb0d8; }
    .rb:disabled { opacity: .4; cursor: default; background: none; border-color: transparent; }
    .rb .ico { font-size: 18px; line-height: 1; }
    .rb .lb { font-size: 11px; white-space: nowrap; }
    .rb.wide { flex-direction: row; gap: 6px; min-width: 0; padding: 4px 8px; }
    .ribbon select { height: 26px; border: 1px solid #c8c8c8; border-radius: 3px; padding: 0 4px; background: #fff; }
    .ribbon input[type=color] { width: 30px; height: 26px; border: 1px solid #c8c8c8; border-radius: 3px; padding: 1px; background: #fff; cursor: pointer; }

    /* Робоча зона */
    .work { flex: 1; display: flex; min-height: 0; }
    aside { width: 190px; background: #f0f0f0; border-right: 1px solid #d0d0d0; overflow-y: auto; padding: 10px 8px; flex-shrink: 0; }
    .thumb { position: relative; margin-bottom: 10px; cursor: pointer; padding: 3px; border-radius: 4px; border: 2px solid transparent; }
    .thumb.on { border-color: #1a4a84; background: #dbe7f5; }
    .thumb .num { position: absolute; left: -2px; top: 0; font-size: 11px; color: #555; width: 14px; }
    .mini { position: relative; width: 160px; height: 90px; box-shadow: 0 1px 3px rgba(0,0,0,.2); overflow: hidden; container-type: size; background: #fff; margin-left: 12px; }

    main { flex: 1; min-width: 0; overflow: auto; background: #d6dbe3; display: flex; padding: 24px; }
    #stageWrap { margin: auto; }
    #stage { position: relative; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); container-type: size; overflow: visible; user-select: none; touch-action: none; }

    /* Елементи слайда */
    .item { position: absolute; box-sizing: border-box; cursor: move; overflow: visible; }
    .item.sel { outline: 1px solid #1a4a84; outline-offset: 0; }
    .txt { white-space: pre-wrap; word-break: break-word; line-height: 1.25; padding: 2px 4px; color: #222; }
    .txt[contenteditable=true] { outline: 2px solid #1a4a84; cursor: text; background: rgba(255,255,255,.6); }
    .pic { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
    .h { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid #1a4a84; border-radius: 2px; z-index: 5; }
    .h.nw { left: -6px; top: -6px; cursor: nwse-resize; }
    .h.ne { right: -6px; top: -6px; cursor: nesw-resize; }
    .h.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .h.se { right: -6px; bottom: -6px; cursor: nwse-resize; }

    /* Рядок стану */
    .status { background: #f3f3f3; border-top: 1px solid #d0d0d0; height: 26px; display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 12px; color: #555; flex-shrink: 0; }
    .status .sp { margin-left: auto; }
    .status select { height: 20px; font-size: 12px; }
    .hint { font-size: 11px; color: #777; }

    @media (max-width: 760px) {
        aside { width: 120px; }
        .mini { width: 100px; height: 56px; }
        .titlebar input { width: 140px; }
    }
    
        /* ===== Презентації на телефоні ===== */
        @media (max-width: 760px) {
            .ribbon { height: auto; flex-wrap: nowrap; overflow-x: auto; padding: 4px 6px; }
            .ribbon .group { min-width: max-content; }
            .work { flex-direction: column; }
            aside { width: 100%; height: 112px; border-right: none; border-bottom: 1px solid #d0d0d0; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 6px; flex-shrink: 0; }
            .thumb { min-width: 112px; margin-bottom: 0; }
            .mini { width: 100px !important; height: 56px !important; margin-left: 6px; }
            main { padding: 8px !important; display: block !important; overflow: visible; }
            #stageWrap { width: 100% !important; margin: 0 !important; }
            #stage { width: 100% !important; height: auto !important; aspect-ratio: 16 / 9; min-height: 180px; }
            .status { flex-wrap: wrap; height: auto; padding: 6px 10px 62px; gap: 6px; }
            .status .sp { display: none; }
            .titlebar .saved { display: none; }
            .titlebar input { width: 150px; }
        }

        /* Друга кнопка «Головна» на телефоні (знизу зліва) */
        .mhome { display: none; }
        @media (max-width: 760px) {
            .mhome { display: flex; position: fixed; left: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; background: #1a4a84; color: #fff; align-items: center; justify-content: center; text-decoration: none; font-size: 22px; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
        }
    </style>
</head>
<body>
<div class="titlebar">
    <span class="app">📊 A-Presentation</span>
    <input type="text" id="title" placeholder="Назва презентації" maxlength="80">
    <a href="index.html">← Головна</a>
    <span class="saved" id="saved"></span>
</div>

<div class="ribbon-tabs">
    <button type="button" data-tab="home" class="on">Головна</button>
    <button type="button" data-tab="insert">Вставка</button>
    <button type="button" data-tab="design">Дизайн</button>
    <button type="button" data-tab="view">Вигляд</button>
</div>

<div class="ribbon">
    <div class="panel on" data-panel="home">
        <div class="group"><div class="gb">
            <button class="rb" id="bUndo" type="button"><span class="ico">↶</span><span class="lb">Скасувати</span></button>
        </div><div class="gl">Дії</div></div>
        <div class="group"><div class="gb">
            <button class="rb" id="bNew" type="button"><span class="ico">＋</span><span class="lb">Новий слайд</span></button>
            <button class="rb" id="bDup" type="button"><span class="ico">⧉</span><span class="lb">Дублювати</span></button>
            <button class="rb" id="bDel" type="button"><span class="ico">🗑</span><span class="lb">Видалити слайд</span></button>
            <select id="layout" title="Макет нового слайда" style="width:150px;">
                <option value="">Новий слайд з макетом…</option>
                <option value="title">Титул</option>
                <option value="titleContent">Заголовок і текст</option>
                <option value="twoCol">Два стовпці</option>
            </select>
        </div><div class="gl">Слайди</div></div>
        <div class="group"><div class="gb">
            <select id="font" title="Шрифт" style="width:140px;">
                <option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Times New Roman</option>
            </select>
            <select id="size" title="Розмір" style="width:58px;">
                <option value="20">20</option><option value="28">28</option><option value="36">36</option><option value="48" selected>48</option><option value="64">64</option><option value="80">80</option>
            </select>
            <button class="rb" id="bBold" type="button" title="Жирний"><span class="ico"><b>B</b></span></button>
            <input type="color" id="color" value="#222222" title="Колір">
        </div><div class="gl">Шрифт</div></div>
        <div class="group"><div class="gb">
            <button class="rb" id="al-l" type="button" title="Ліворуч"><span class="ico">⫷</span></button>
            <button class="rb" id="al-c" type="button" title="По центру"><span class="ico">≡</span></button>
            <button class="rb" id="al-r" type="button" title="Праворуч"><span class="ico">⫸</span></button>
        </div><div class="gl">Абзац</div></div>
        <div class="group"><div class="gb">
            <button class="rb" id="bDelItem" type="button"><span class="ico">✕</span><span class="lb">Видалити елемент</span></button>
        </div><div class="gl">Елемент</div></div>
    </div>

    <div class="panel" data-panel="insert">
        <div class="group"><div class="gb">
            <button class="rb" id="bText" type="button"><span class="ico">T</span><span class="lb">Текст</span></button>
            <label class="rb" style="cursor:pointer;"><span class="ico">🖼</span><span class="lb">Фото</span><input type="file" id="photo" accept="image/*" hidden></label>
            <select id="shape" title="Фігура" style="width:160px;">
                <option value="">Фігура…</option>
                <option value="rect">Квадрат</option><option value="rrect">Квадрат із кутами</option><option value="ellipse">Коло</option>
            </select>
        </div><div class="gl">Вставка</div></div>
    </div>

    <div class="panel" data-panel="design">
        <div class="group"><div class="gb">
            <select id="theme" title="Тема" style="width:150px;">
                <option value="light">Світла</option><option value="dark">Темна</option>
                <option value="acore">Acore</option><option value="calm">Спокійна</option><option value="bright">Яскрава</option>
            </select>
            <label style="display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:#444;">Фон слайда
                <input type="color" id="bg" value="#ffffff">
            </label>
        </div><div class="gl">Тема</div></div>
    </div>

    <div class="panel" data-panel="view">
        <div class="group"><div class="gb">
            <select id="zoom" style="width:90px;">
                <option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
            </select>
        </div><div class="gl">Масштаб</div></div>
    </div>

    <div class="group" style="border:none; padding-left:16px;"><div class="gb">
        <button class="rb wide" id="bExport" type="button" style="background:#1a4a84; color:#fff; border-color:#1a4a84;"><span class="ico">⬇</span><span class="lb" style="color:#fff;">Експорт .pptx</span></button>
    </div><div class="gl">Файл</div></div>
</div>

<div class="work">
    <aside id="thumbs"></aside>
    <main id="main"><div id="stageWrap"><div id="stage"></div></div></main>
</div>

<div class="status">
    <span id="slideInfo">Слайд 1 з 1</span>
    <span id="selInfo" class="hint">Клікніть елемент, щоб вибрати</span>
    <span class="sp hint">Подвійний клік по тексту: редагувати · Delete: видалити · Ctrl+Z: скасувати</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
(function () {
    'use strict';
    const KEY = 'acore-pres-v2';
    const $ = s => document.querySelector(s);
    const stage = $('#stage');

    const THEMES = {
        light:  { bg: '#ffffff', accent: '#1a4a84', text: '#222222', font: 'Arial' },
        dark:   { bg: '#1b1f2a', accent: '#60a5fa', text: '#e5e7eb', font: 'Arial' },
        acore:  { bg: '#f4f5f7', accent: '#1a4a84', text: '#333333', font: 'Trebuchet MS' },
        calm:   { bg: '#f7f3ea', accent: '#7c5a2b', text: '#3d3a33', font: 'Georgia' },
        bright: { bg: '#fff7ed', accent: '#ea580c', text: '#1f2937', font: 'Verdana' }
    };
    const uid = () => 'i' + Math.random().toString(36).slice(2, 9);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const clone = x => JSON.parse(JSON.stringify(x));
    const th = () => THEMES[deck.theme] || THEMES.acore;

    function txt(x, y, w, h, text, size, bold, align) {
        const t = THEMES[(deck && deck.theme) || 'acore'];
        return { id: uid(), type: 'text', x, y, w, h, text, size, bold: !!bold,
            color: size >= 40 ? t.accent : t.text, font: t.font, align: align || 'left' };
    }

    function freshDeck() {
        return { title: 'Презентація', theme: 'acore', zoom: 1,
            slides: [{ bg: THEMES.acore.bg, items: [txt(8, 36, 84, 18, 'Заголовок презентації', 56, true, 'center')] }] };
    }

    let deck = load();
    let cur = 0, selId = null, drag = null, zoom = deck.zoom || 1;
    const hist = [];

    function load() {
        for (const k of [KEY, 'acore-slides-test']) {
            try {
                const d = JSON.parse(localStorage.getItem(k) || 'null');
                if (d && Array.isArray(d.slides) && d.slides.length) { if (!d.theme) d.theme = 'acore'; return d; }
            } catch (e) { /* пошкоджено — пробуємо далі */ }
        }
        return freshDeck();
    }

    let saveT = null;
    function save() {
        clearTimeout(saveT);
        saveT = setTimeout(() => {
            try {
                deck.zoom = zoom;
                localStorage.setItem(KEY, JSON.stringify(deck));
                $('#saved').textContent = 'Збережено ' + new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
            } catch (e) { $('#saved').textContent = 'Мало місця — експортуйте .pptx'; }
        }, 250);
    }

    // Знімок стану перед зміною (для Ctrl+Z)
    function snap() {
        hist.push(JSON.stringify(deck));
        if (hist.length > 60) hist.shift();
    }
    function undo() {
        if (!hist.length) return;
        deck = JSON.parse(hist.pop());
        cur = Math.min(cur, deck.slides.length - 1);
        selId = null;
        render();
        save();
    }

    const slide = () => deck.slides[cur];
    const find = id => slide().items.find(i => i.id === id);
    const sel = () => (selId ? find(selId) : null);

    /* ---------- Малювання ---------- */
    function drawItem(it) {
        const el = document.createElement('div');
        el.className = 'item ' + it.type;
        el.dataset.id = it.id;
        el.style.left = it.x + '%';
        el.style.top = it.y + '%';
        el.style.width = it.w + '%';
        el.style.height = it.h + '%';
        if (it.type === 'text') {
            el.classList.add('txt');
            el.style.fontSize = (it.size / 540 * 100) + 'cqh';
            el.style.color = it.color;
            el.style.fontWeight = it.bold ? '700' : '400';
            el.style.fontFamily = it.font || th().font;
            el.style.textAlign = it.align || 'left';
            el.textContent = it.text;
        } else if (it.type === 'shape') {
            el.style.background = it.fill;
            el.style.borderRadius = it.shape === 'ellipse' ? '50%' : it.shape === 'rrect' ? '12%' : '0';
        } else {
            const img = document.createElement('img');
            img.className = 'pic';
            img.src = it.src;
            img.draggable = false;
            el.appendChild(img);
        }
        return el;
    }

    function renderStage() {
        const s = slide();
        stage.style.width = (960 * zoom) + 'px';
        stage.style.height = (540 * zoom) + 'px';
        stage.style.background = s.bg;
        stage.textContent = '';
        s.items.forEach(it => {
            const el = drawItem(it);
            if (it.id === selId) {
                el.classList.add('sel');
                ['nw', 'ne', 'sw', 'se'].forEach(k => {
                    const h = document.createElement('div');
                    h.className = 'h ' + k;
                    h.dataset.h = k;
                    el.appendChild(h);
                });
            }
            stage.appendChild(el);
        });
    }

    function renderThumbs() {
        const box = $('#thumbs');
        box.textContent = '';
        deck.slides.forEach((s, i) => {
            const t = document.createElement('div');
            t.className = 'thumb' + (i === cur ? ' on' : '');
            const n = document.createElement('div');
            n.className = 'num';
            n.textContent = i + 1;
            const m = document.createElement('div');
            m.className = 'mini';
            m.style.background = s.bg;
            s.items.forEach(it => m.appendChild(drawItem(it)));
            t.append(n, m);
            t.addEventListener('click', () => { cur = i; selId = null; render(); });
            box.appendChild(t);
        });
        const on = box.querySelector('.thumb.on');
        if (on) on.scrollIntoView({ block: 'nearest' });
    }

    function renderStatus() {
        $('#slideInfo').textContent = 'Слайд ' + (cur + 1) + ' з ' + deck.slides.length;
        const it = sel();
        const names = { text: 'Текст', image: 'Зображення', shape: 'Фігура' };
        $('#selInfo').textContent = it ? names[it.type] + ' · ' + Math.round(it.x) + '%, ' + Math.round(it.y) + '%' : 'Клікніть елемент, щоб вибрати';
        $('#bUndo').disabled = !hist.length;
        $('#bDelItem').disabled = !it;
        $('#bDel').disabled = deck.slides.length <= 1;
        $('#bDup').disabled = false;
        $('#bBold').classList.toggle('on', !!(it && it.type === 'text' && it.bold));
        ['al-l', 'al-c', 'al-r'].forEach(k => $('#' + k).disabled = !(it && it.type === 'text'));
        const a = it && it.type === 'text' ? (it.align || 'left') : null;
        $('#al-l').classList.toggle('on', a === 'left');
        $('#al-c').classList.toggle('on', a === 'center');
        $('#al-r').classList.toggle('on', a === 'right');
        if (it && it.type === 'text') {
            $('#font').value = it.font || th().font;
            $('#size').value = String(it.size);
            $('#color').value = it.color;
        }
        $('#bg').value = slide().bg;
        $('#theme').value = deck.theme || 'acore';
        $('#zoom').value = String(zoom);
        $('#title').value = deck.title || '';
    }

    function render() {
        renderThumbs();
        renderStage();
        renderStatus();
    }

    /* ---------- Мишка: переміщення і зміна розміру ---------- */
    stage.addEventListener('pointerdown', e => {
        const active = document.activeElement;
        if (active && active.isContentEditable && !e.target.closest('[contenteditable=true]')) active.blur();
        if (active && active.isContentEditable) return;
        const h = e.target.closest('.h');
        const el = e.target.closest('.item');
        if (!el) { if (selId) { selId = null; render(); } return; }
        const it = find(el.dataset.id);
        if (!it) return;
        if (selId !== it.id) { selId = it.id; render(); }
        drag = {
            mode: h ? 'resize' : 'move', corner: h ? h.dataset.h : null, id: it.id,
            sx: e.clientX, sy: e.clientY, o: { x: it.x, y: it.y, w: it.w, h: it.h }, moved: false
        };
        e.preventDefault();
    });

    window.addEventListener('pointermove', e => {
        if (!drag) return;
        const it = find(drag.id);
        if (!it) return;
        const r = stage.getBoundingClientRect();
        const dx = (e.clientX - drag.sx) / r.width * 100;
        const dy = (e.clientY - drag.sy) / r.height * 100;
        if (!drag.moved) {
            if (Math.abs(dx) + Math.abs(dy) < 0.4) return;
            snap();
            drag.moved = true;
        }
        const o = drag.o;
        if (drag.mode === 'move') {
            it.x = clamp(o.x + dx, 0, 100 - it.w);
            it.y = clamp(o.y + dy, 0, 100 - it.h);
        } else {
            const k = drag.corner;
            let x = o.x, y = o.y, w = o.w, h = o.h;
            if (k.includes('e')) w = o.w + dx;
            if (k.includes('s')) h = o.h + dy;
            if (k.includes('w')) { x = o.x + dx; w = o.w - dx; }
            if (k.includes('n')) { y = o.y + dy; h = o.h - dy; }
            if (w < 4) { if (k.includes('w')) x = o.x + o.w - 4; w = 4; }
            if (h < 4) { if (k.includes('n')) y = o.y + o.h - 4; h = 4; }
            x = clamp(x, 0, 100 - w);
            y = clamp(y, 0, 100 - h);
            it.x = x; it.y = y; it.w = w; it.h = h;
        }
        const el = stage.querySelector('[data-id="' + it.id + '"]');
        if (el) {
            el.style.left = it.x + '%'; el.style.top = it.y + '%';
            el.style.width = it.w + '%'; el.style.height = it.h + '%';
        }
    });

    window.addEventListener('pointerup', () => {
        if (!drag) return;
        const moved = drag.moved;
        drag = null;
        if (moved) { save(); render(); }
    });

    /* ---------- Редагування тексту ---------- */
    stage.addEventListener('dblclick', e => {
        const el = e.target.closest('.txt');
        if (!el) return;
        const it = find(el.dataset.id);
        if (!it) return;
        snap();
        el.contentEditable = 'true';
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        const s2 = window.getSelection();
        s2.removeAllRanges();
        s2.addRange(range);
        const done = () => {
            el.contentEditable = 'false';
            it.text = el.innerText.trim() ? el.innerText : 'Текст';
            save();
            render();
        };
        el.addEventListener('blur', done, { once: true });
    });

    /* ---------- Дії ---------- */
    function applyText(fn) {
        const it = sel();
        if (!it || it.type !== 'text') return;
        snap();
        fn(it);
        save();
        render();
    }

    function addItem(it) {
        snap();
        slide().items.push(it);
        selId = it.id;
        save();
        render();
    }

    function applyTheme(name) {
        snap();
        deck.theme = name;
        const t = th();
        deck.slides.forEach(s => {
            s.bg = t.bg;
            s.items.forEach(it => { if (it.type === 'text') { it.color = it.size >= 40 ? t.accent : t.text; it.font = t.font; } });
        });
        save();
        render();
    }

    function addLayout(kind) {
        if (!kind) return;
        const t = th();
        const s = { bg: t.bg, items: [] };
        if (kind === 'title') {
            s.items = [txt(8, 32, 84, 20, 'Назва презентації', 64, true, 'center'), txt(8, 56, 84, 12, 'Підзаголовок', 28, false, 'center')];
        } else if (kind === 'titleContent') {
            s.items = [txt(6, 6, 88, 14, 'Заголовок', 44, true, 'left'), txt(6, 26, 88, 64, 'Текст слайда', 28, false, 'left')];
        } else if (kind === 'twoCol') {
            s.items = [txt(6, 6, 88, 14, 'Заголовок', 44, true, 'left'), txt(6, 26, 42, 64, 'Ліва колонка', 26, false, 'left'), txt(52, 26, 42, 64, 'Права колонка', 26, false, 'left')];
        }
        snap();
        deck.slides.splice(cur + 1, 0, s);
        cur++;
        selId = null;
        save();
        render();
    }

    function compressToJpeg(file) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const MAX = 1280;
                const k = Math.min(1, MAX / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * k);
                c.height = Math.round(img.height * k);
                const g = c.getContext('2d');
                g.fillStyle = '#fff';
                g.fillRect(0, 0, c.width, c.height);
                g.drawImage(img, 0, 0, c.width, c.height);
                resolve({ src: c.toDataURL('image/jpeg', 0.75), w: img.width, h: img.height });
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('це не зображення')); };
            img.src = url;
        });
    }

    /* ---------- Прив'язка кнопок ---------- */
    document.querySelectorAll('.ribbon-tabs button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.ribbon-tabs button').forEach(x => x.classList.toggle('on', x === b));
        document.querySelectorAll('.ribbon .panel').forEach(p => p.classList.toggle('on', p.dataset.panel === b.dataset.tab));
    }));

    $('#title').addEventListener('input', e => { deck.title = e.target.value.trim() || 'Презентація'; save(); });
    $('#bUndo').addEventListener('click', undo);

    $('#bNew').addEventListener('click', () => {
        snap();
        deck.slides.splice(cur + 1, 0, { bg: slide().bg, items: [] });
        cur++;
        selId = null;
        save();
        render();
    });
    $('#bDup').addEventListener('click', () => {
        snap();
        const copy = clone(slide());
        copy.items.forEach(it => { it.id = uid(); });
        deck.slides.splice(cur + 1, 0, copy);
        cur++;
        selId = null;
        save();
        render();
    });
    $('#bDel').addEventListener('click', () => {
        if (deck.slides.length <= 1) return;
        if (!confirm('Видалити слайд?')) return;
        snap();
        deck.slides.splice(cur, 1);
        cur = Math.max(0, cur - 1);
        selId = null;
        save();
        render();
    });
    $('#layout').addEventListener('change', e => { addLayout(e.target.value); e.target.value = ''; });

    $('#font').addEventListener('change', e => applyText(it => { it.font = e.target.value; }));
    $('#size').addEventListener('change', e => applyText(it => { it.size = Number(e.target.value); }));
    $('#bBold').addEventListener('click', () => applyText(it => { it.bold = !it.bold; }));
    $('#color').addEventListener('input', e => applyText(it => { it.color = e.target.value; }));
    $('#al-l').addEventListener('click', () => applyText(it => { it.align = 'left'; }));
    $('#al-c').addEventListener('click', () => applyText(it => { it.align = 'center'; }));
    $('#al-r').addEventListener('click', () => applyText(it => { it.align = 'right'; }));

    $('#bDelItem').addEventListener('click', () => {
        if (!selId) return;
        snap();
        slide().items = slide().items.filter(i => i.id !== selId);
        selId = null;
        save();
        render();
    });

    $('#bText').addEventListener('click', () => addItem(txt(20, 40, 60, 14, 'Новий текст', 36, false, 'left')));
    $('#shape').addEventListener('change', e => {
        const kind = e.target.value;
        e.target.value = '';
        if (!kind) return;
        addItem({ id: uid(), type: 'shape', shape: kind, x: 35, y: 35,
            w: kind === 'ellipse' ? 18 : 24, h: kind === 'ellipse' ? 32 : 18, fill: th().accent });
    });
    $('#photo').addEventListener('change', async e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        try {
            const p = await compressToJpeg(file);
            const w = 40;
            const h = Math.min(70, w * (p.h / p.w) * (16 / 9));
            addItem({ id: uid(), type: 'image', x: 30, y: 22, w, h, src: p.src });
        } catch (err) {
            alert('Не вдалося додати фото: ' + err.message);
        }
    });

    $('#theme').addEventListener('change', e => applyTheme(e.target.value));
    $('#bg').addEventListener('input', e => {
        snap();
        slide().bg = e.target.value;
        save();
        render();
    });
    $('#zoom').addEventListener('change', e => { zoom = Number(e.target.value); save(); render(); });

    document.addEventListener('keydown', e => {
        const ae = document.activeElement;
        const typing = ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
        if (typing) return;
        if ((e.key === 'Delete' || e.key === 'Backspace') && selId) {
            e.preventDefault();
            $('#bDelItem').click();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); $('#bDup').click(); return; }
        if (selId && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            const it = find(selId);
            const step = e.shiftKey ? 2 : 0.5;
            if (!hist.length || hist[hist.length - 1] !== JSON.stringify(deck)) snap();
            if (e.key === 'ArrowLeft') it.x = clamp(it.x - step, 0, 100 - it.w);
            if (e.key === 'ArrowRight') it.x = clamp(it.x + step, 0, 100 - it.w);
            if (e.key === 'ArrowUp') it.y = clamp(it.y - step, 0, 100 - it.h);
            if (e.key === 'ArrowDown') it.y = clamp(it.y + step, 0, 100 - it.h);
            save();
            render();
        }
    });

    /* ---------- Експорт у PowerPoint ---------- */
    $('#bExport').addEventListener('click', () => {
        if (typeof PptxGenJS === 'undefined') { alert('Бібліотека презентацій не завантажилась. Оновіть сторінку.'); return; }
        try {
            const p = new PptxGenJS();
            p.layout = 'LAYOUT_WIDE';
            const W = 13.333, H = 7.5;
            deck.slides.forEach(s => {
                const sl = p.addSlide();
                sl.background = { color: s.bg.replace('#', '') };
                s.items.forEach(it => {
                    const x = it.x / 100 * W, y = it.y / 100 * H, w = it.w / 100 * W, h = it.h / 100 * H;
                    if (it.type === 'text') {
                        sl.addText(it.text, {
                            x, y, w, h, fontSize: it.size, color: it.color.replace('#', ''),
                            bold: !!it.bold, fontFace: it.font || th().font, align: it.align || 'left', valign: 'top', margin: 0
                        });
                    } else if (it.type === 'image') {
                        sl.addImage({ data: it.src, x, y, w, h });
                    } else if (it.type === 'shape') {
                        const kind = it.shape === 'ellipse' ? p.ShapeType.ellipse
                            : it.shape === 'rrect' ? p.ShapeType.roundRect : p.ShapeType.rect;
                        sl.addShape(kind, { x, y, w, h, fill: { color: it.fill.replace('#', '') } });
                    }
                });
            });
            const name = (deck.title || 'presentation').replace(/[\\/:*?"<>|]+/g, '_') + '.pptx';
            p.writeFile({ fileName: name });
        } catch (e) {
            alert('Не вдалося створити презентацію: ' + e.message);
        }
    });

    render();
    save();
})();
</script>
    <a class="mhome" href="index.html" aria-label="Головна">⌂</a>
</body>
</html>
